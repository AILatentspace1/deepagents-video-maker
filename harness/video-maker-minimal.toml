# Minimal better-harness config for video-maker scriptwriter optimization
#
# This config exposes only the scriptwriter prompt for autonomous optimization.
# The outer Deep Agent will read eval failures and propose edits to improve
# script generation quality.

[experiment]
name = "video-maker-scriptwriter-minimal"
runner = "pytest"
workspace_root = "."
# GLM-4.5-Air is a weaker model (ZhipuAI haiku-tier) that struggles with strict
# structural requirements - this is intentional: it causes tests to fail so that
# better-harness has something to optimize.
model = "GLM-4.5-Air"
max_iterations = 5

[better_agent]
# The optimizer itself uses the stronger model (claude-sonnet-4-6 / glm-5-turbo)
model = "claude-sonnet-4-6"
max_turns = 200

[runner.pytest]
project_root = ".."
uv_group = "dev"
model_flag = "--model"
summary_flag = "--evals-report-file"
pytest_args = ["-q"]

# Single surface: scriptwriter prompt
# The outer agent can edit this file to improve script generation
[surfaces.scriptwriter_prompt]
kind = "workspace_file"
target = "../skills/video-maker-v2/agents/scriptwriter.md"
filename = "scriptwriter.md"
base_file = "../skills/video-maker-v2/agents/scriptwriter.md"

# Train cases: deterministic v2 contract tests kept in-repo after legacy eval removal
[[cases]]
case_id = "tests/deepagents_video_maker/test_ratify_script.py::test_ratify_script_passes_with_script_and_contract"
split = "train"
stratum = "structure"

[[cases]]
case_id = "tests/deepagents_video_maker/test_ratify_script.py::test_ratify_script_rejects_too_many_consecutive_same_scene_types"
split = "train"
stratum = "scene_quality"

[[cases]]
case_id = "tests/deepagents_video_maker/test_ratify_script.py::test_ratify_script_rejects_data_card_without_grounded_data_semantic"
split = "train"
stratum = "structure"

# Holdout cases: source intake and v2 wiring regressions
[[cases]]
case_id = "tests/deepagents_video_maker/test_research_flow.py::test_ratify_source_intake_completes_on_pass"
split = "holdout"
stratum = "structure"

[[cases]]
case_id = "tests/deepagents_video_maker/test_research_flow.py::test_ratify_source_intake_blocks_missing_folder"
split = "holdout"
stratum = "scene_quality"

[[cases]]
case_id = "tests/deepagents_video_maker/test_langchain_tools.py::test_script_task_uses_source_manifest_and_contract_without_research"
split = "train"
stratum = "scene_quality"

[[cases]]
case_id = "tests/deepagents_video_maker/test_skill_files.py::test_harness_and_package_scripts_do_not_reference_removed_v1_or_evals"
split = "train"
stratum = "structure"
